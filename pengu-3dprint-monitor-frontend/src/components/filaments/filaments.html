<div>
  <div class="mb-5 flex flex-wrap items-center justify-between gap-4">
    <div>
      <h2 id="filaments-title" class="text-xl font-semibold">Filaments</h2>
      <p class="mt-1 text-sm text-slate-600">View your filaments.</p>
    </div>
    <p-button label="Add filament" />
  </div>

  <p-table [value]="[]" [tableStyle]="{ 'min-width': '50rem' }">
    <ng-template #header>
      <tr>
        <th class="py-3 text-left text-sm font-semibold text-slate-600">Brand</th>
        <th class="py-3 text-left text-sm font-semibold text-slate-600">Filament type</th>
        <th class="py-3 text-left text-sm font-semibold text-slate-600">Weight</th>
        <th class="py-3 text-left text-sm font-semibold text-slate-600">Color</th>
        <th class="py-3 text-left text-sm font-semibold text-slate-600">Printer</th>
        <th class="py-3 text-left text-sm font-semibold text-slate-600">Actions</th>
      </tr>
    </ng-template>
    <ng-template #emptymessage>
      <tr>
        <td colspan="6" class="py-4 text-center text-sm text-slate-600">
          No filaments have been added yet.
        </td>
      </tr>
    </ng-template>
  </p-table>
</div>
