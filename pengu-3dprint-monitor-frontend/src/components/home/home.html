<div class="min-h-screen bg-slate-50 text-slate-900">
  <div class="flex min-h-screen flex-col md:flex-row">
    <div
      class="w-full border-b border-slate-200 p-5 md:min-h-screen md:w-64 md:border-b-0 md:border-r"
    >
      <div class="mb-8 flex items-center gap-3 text-xl font-semibold">
        <span class="flex size-10 items-center justify-center rounded-xl bg-emerald-600 text-white">
          P
        </span>
        <span>Pengu Monitor</span>
      </div>

      <p class="mb-3 px-3 text-xs font-semibold uppercase tracking-wide text-slate-500">
        Workspace
      </p>
      <div>
        <p-menu [model]="navigationItems" class="w-full" />
      </div>
    </div>

    <div class="min-w-0 bg-white flex-1 p-5 sm:p-8">
      <div class="mb-6">
        <p class="mb-2 text-sm font-medium text-emerald-700">Printer management</p>
        <h1 class="text-3xl font-semibold tracking-tight">Workspace</h1>
      </div>

      <p-tabs [value]="activeTab()">
        <p-tablist>
          <p-tab value="printers" routerLink="/printers">Printers</p-tab>
          <p-tab value="nozzles" routerLink="/nozzles">Nozzles</p-tab>
          <p-tab value="filaments" routerLink="/filaments">Filaments</p-tab>
          <p-tab value="beds" routerLink="/beds">Beds</p-tab>
        </p-tablist>
        <p-tabpanels>
          <p-tabpanel [value]="activeTab()">
            <router-outlet />
          </p-tabpanel>
        </p-tabpanels>
      </p-tabs>
    </div>
  </div>
</div>
