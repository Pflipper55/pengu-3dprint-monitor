<div>
  <div class="mb-5 flex flex-wrap items-center justify-between gap-4">
    <div>
      <h2 id="printers-title" class="text-xl font-semibold">Printers</h2>
      <p class="mt-1 text-sm text-slate-600">View your printers.</p>
    </div>
    <p-button label="Add printer" (onClick)="showCreatePrinter()" />
  </div>

  <p-table
    #printerTable
    [value]="printers()"
    [globalFilterFields]="['name', 'ip', 'firmwareVersion']"
    [paginator]="true"
    [rows]="10"
    [rowsPerPageOptions]="[5, 10, 25]"
    [sortMode]="'multiple'"
    [tableStyle]="{ 'min-width': '50rem' }"
  >
    <ng-template #caption>
      <div class="flex justify-end pb-3">
        <input
          pInputText
          type="text"
          placeholder="Search printers"
          aria-label="Search printers"
          (input)="filterPrinters(printerTable, $event)"
        />
      </div>
    </ng-template>
    <ng-template #header>
      <tr>
        <th class="py-3 text-left text-sm font-semibold text-slate-600"></th>
        <th pSortableColumn="name" class="py-3 text-left text-sm font-semibold text-slate-600">
          Name <p-sortIcon field="name" />
        </th>
        <th
          pSortableColumn="printerType"
          class="py-3 text-left text-sm font-semibold text-slate-600"
        >
          Type <p-sortIcon field="printerType" />
        </th>
        <th pSortableColumn="ip" class="py-3 text-left text-sm font-semibold text-slate-600">
          IP address <p-sortIcon field="ip" />
        </th>
        <th
          pSortableColumn="firmwareVersion"
          class="py-3 text-left text-sm font-semibold text-slate-600"
        >
          Firmware version <p-sortIcon field="firmwareVersion" />
        </th>
        <th class="py-3 text-left text-sm font-semibold text-slate-600">Actions</th>
      </tr>
    </ng-template>
    <ng-template #body let-printer>
      <tr>
        <td class="py-3">
          <img class="h-12 w-12" [src]="printer.printerType | printerSvg" [alt]="printer.name" />
        </td>
        <td class="py-3 text-sm font-medium text-surface-900 dark:text-surface-0">
          {{ printer.name }}
        </td>
        <td class="py-3 text-sm font-medium text-surface-900 dark:text-surface-0">
          {{ printer.printerType | printerType }}
        </td>
        <td class="py-3 text-sm font-medium text-surface-900 dark:text-surface-0">
          {{ printer.ip }}
        </td>
        <td class="py-3 text-sm font-medium text-surface-900 dark:text-surface-0">
          {{ printer.firmwareVersion }}
        </td>
        <td class="py-3">
          <div class="flex items-center gap-2">
            <p-button
              icon="pi pi-info"
              [size]="'small'"
              [severity]="'info'"
              [rounded]="true"
              (onClick)="showPrinterDetails(printer.id)"
            />
            <p-button
              icon="pi pi-pencil"
              [size]="'small'"
              [severity]="'secondary'"
              [rounded]="true"
              (onClick)="showEditPrinter(printer.id)"
            />
            <p-button
              icon="pi pi-trash"
              [size]="'small'"
              [rounded]="true"
              [severity]="'danger'"
              (onClick)="confirmDeletePrinter(printer)"
            />
          </div>
        </td>
      </tr>
    </ng-template>
    <ng-template #emptymessage>
      <tr>
        <td colspan="6" class="py-4 text-center text-sm text-slate-600">
          No printers have been added yet.
        </td>
      </tr>
    </ng-template>
  </p-table>
  <app-printer-details-modal></app-printer-details-modal>
  <app-create-printer-modal (printerCreated)="loadPrinters()"></app-create-printer-modal>
  <app-edit-printer-modal (printerUpdated)="loadPrinters()"></app-edit-printer-modal>
  <p-confirmDialog />
  <p-toast />
</div>
