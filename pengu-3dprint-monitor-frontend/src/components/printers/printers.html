<div>
  <div class="mb-5 flex flex-wrap items-center justify-between gap-4">
    <div>
      <h2 id="printers-title" class="text-xl font-semibold">Printers</h2>
      <p class="mt-1 text-sm text-slate-600">View your printers.</p>
    </div>
    <p-button label="Add printer" (onClick)="showCreatePrinter()" />
  </div>

  <p-table [value]="printers()" [tableStyle]="{ 'min-width': '50rem' }">
    <ng-template #header>
      <tr>
        <th class="py-3 text-left text-sm font-semibold text-slate-600"></th>
        <th class="py-3 text-left text-sm font-semibold text-slate-600">Name</th>
        <th class="py-3 text-left text-sm font-semibold text-slate-600">Type</th>
        <th class="py-3 text-left text-sm font-semibold text-slate-600">IP address</th>
        <th class="py-3 text-left text-sm font-semibold text-slate-600">Firmware version</th>
        <th class="py-3 text-left text-sm font-semibold text-slate-600">Actions</th>
      </tr>
    </ng-template>
    <ng-template #body let-printer>
      <tr>
        <td class="py-3">
          <img class="h-12 w-12" [src]="printer.printerType | printerSvg" [alt]="printer.name" />
        </td>
        <td class="py-3 text-sm font-medium text-surface-900 dark:text-surface-0">
          {{ printer.name }}
        </td>
        <td class="py-3 text-sm font-medium text-surface-900 dark:text-surface-0">
          {{ printer.printerType | printerType }}
        </td>
        <td class="py-3 text-sm font-medium text-surface-900 dark:text-surface-0">
          {{ printer.ip }}
        </td>
        <td class="py-3 text-sm font-medium text-surface-900 dark:text-surface-0">
          {{ printer.firmwareVersion }}
        </td>
        <td class="py-3">
          <div class="flex items-center gap-2">
            <p-button
              icon="pi pi-info"
              [size]="'small'"
              [severity]="'info'"
              [rounded]="true"
              (onClick)="showPrinterDetails(printer.id)"
            />
            <p-button
              icon="pi pi-pencil"
              [size]="'small'"
              [severity]="'secondary'"
              [rounded]="true"
            />
            <p-button icon="pi pi-trash" [size]="'small'" [rounded]="true" [severity]="'danger'" />
          </div>
        </td>
      </tr>
    </ng-template>
    <ng-template #emptymessage>
      <tr>
        <td colspan="6" class="py-4 text-center text-sm text-slate-600">
          No printers have been added yet.
        </td>
      </tr>
    </ng-template>
  </p-table>
  <app-printer-details-modal></app-printer-details-modal>
  <app-create-printer-modal (printerCreated)="loadPrinters()"></app-create-printer-modal>
  <p-toast />
</div>
