<div>
  <div class="mb-5 flex flex-wrap items-center justify-between gap-4">
    <div>
      <h2 id="printers-title" class="text-xl font-semibold">Printers</h2>
      <p class="mt-1 text-sm text-slate-600">View your printers.</p>
    </div>
    <p-button label="Add printer" />
  </div>

  <p-dataview [value]="this.printers()" emptyMessage="No printers have been added yet.">
    <ng-template #list let-items>
      <div class="hidden md:grid grid-cols-4 gap-6 border-b border-surface-200 dark:border-surface-700">
        <div class="py-3 text-sm font-semibold text-slate-600">Name</div>
        <div class="py-3 text-sm font-semibold text-slate-600">Type</div>
        <div class="py-3 text-sm font-semibold text-slate-600">IP address</div>
        <div class="py-3 text-sm font-semibold text-slate-600">Firmware version</div>
      </div>
      <div *ngFor="let printer of items">
        <div class="grid grid-cols-1 md:grid-cols-4 gap-6">
          <div class="flex flex-row md:flex-col justify-between items-start gap-2">
            <div class="text-lg font-medium text-surface-900 dark:text-surface-0 mt-2">
              {{ printer.name }}
            </div>
          </div>
          <div class="flex flex-row md:flex-col justify-between items-start gap-2">
            <div class="text-lg font-medium text-surface-900 dark:text-surface-0 mt-2">
              {{ printer.printerType | printerType }}
            </div>
          </div>
          <div class="flex flex-row md:flex-col justify-between items-start gap-2">
            <div class="text-lg font-medium text-surface-900 dark:text-surface-0 mt-2">
              {{ printer.ip }}
            </div>
          </div>
          <div class="flex flex-row md:flex-col justify-between items-start gap-2">
            <div class="text-lg font-medium text-surface-900 dark:text-surface-0 mt-2">
              {{ printer.firmwareVersion }}
            </div>
          </div>
        </div>
      </div>
    </ng-template>
  </p-dataview>
</div>
